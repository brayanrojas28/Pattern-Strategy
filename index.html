<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pattern Strategy</title>
    <link rel="icon" href="/logo.png" />
    <style>
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: #1a1a1a;
        color: white;
        padding: 20px;
      }
      .container {
        display: grid;
        grid-template-columns: repeat(2, 300px);
        gap: 80px;
        justify-content: center;
        padding: 40px;
      }

      .card {
        background: #2a2a2a;
        padding: 20px;
        border-radius: 12px;
        border: 1px solid #444;
        width: 300px;
      }
      h3 {
        color: #646cff;
        margin-top: 0;
      }
      select,
      input,
      button {
        width: 100%;
        margin: 10px 0;
        padding: 10px;
        border-radius: 6px;
        border: none;
        box-sizing: border-box;
      }
      button {
        background: #646cff;
        color: white;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.3s;
      }
      button:hover {
        background: #535bf2;
      }
      .result {
        background: #111;
        padding: 12px;
        border-radius: 6px;
        border-left: 4px solid #646cff;
        min-height: 20px;
        font-size: 0.9em;
        color: #00ff88;
        word-wrap: break-word;
      }
    </style>
  </head>
  <body>
    <h1 style="text-align: center">Uses of the Strategy Pattern :)</h1>

    <div class="container">
      <div class="card">
        <h3>💳 Payments</h3>
        <input type="number" id="payAmount" placeholder="Monto a Pagar" />
        <select id="payStrategy">
          <option value="card">Tarjeta de Crédito</option>
          <option value="nequi">Nequi</option>
          <option value="paypal">PayPal</option>
        </select>
        <button id="btnPay">Ejecutar Pago</button>
        <div id="payResult" class="result">Esperando...</div>
      </div>

      <div class="card">
        <h3>📚 Learning</h3>
        <input type="number" id="learnLessons" placeholder="Tema a Estudiar" />
        <select id="learnStrategy">
          <option value="video">Video</option>
          <option value="reading">Lectura</option>
          <option value="practice">Ejercicios Prácticos</option>
        </select>
        <button id="btnLearn">Empezar</button>
        <div id="learnResult" class="result">Esperando...</div>
      </div>

      <div class="card">
        <h3>🎮 Gaming</h3>
        <input type="number" id="gameLevel" placeholder="Nombre del Jugador" />
        <select id="gameStrategy">
          <option value="easy">Fácil</option>
          <option value="medium">Medio</option>
          <option value="hard">Difícil</option>
        </select>
        <button id="btnGame">Iniciar Partida</button>
        <div id="gameResult" class="result">Esperando...</div>
      </div>

      <div class="card">
        <h3>🏥 Healthcare</h3>
        <input type="number" id="severity" placeholder="Nombre del Paciente" />
        <select id="treatmentStrategy">
          <option value="medication">Medicamentos</option>
          <option value="surgery">Cirugía</option>
          <option value="therapy">Terapia</option>
        </select>
        <button id="btnMedicine">Aplicar Tratamiento</button>
        <div id="treatmentResult" class="result">Esperando...</div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
